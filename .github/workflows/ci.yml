name: ci

permissions:
  contents: read

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: desktop
            answers: tests/fixtures/answers-desktop.json
            allowed: "0"
          - fixture: desktop-debug
            answers: tests/fixtures/answers-desktop-debug.json
            allowed: "0"
          - fixture: laptop
            answers: tests/fixtures/answers-laptop.json
            allowed: "0 3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache key week
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            OCK_Files
            Scripts/macserial*
            Scripts/ocvalidate*
          key: ock-${{ matrix.fixture }}-${{ hashFiles('.github/workflows/ci.yml') }}-${{ steps.week.outputs.week }}
          restore-keys: |
            ock-${{ matrix.fixture }}-${{ hashFiles('.github/workflows/ci.yml') }}-
      - name: Hardware scan on the runner
        if: matrix.fixture == 'desktop'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'EOF'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location("ocs", "OpenCoreWizard.py")
          ocs = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(ocs)
          report_path, acpi_dir, error = ocs.OCPE().export_hardware_report()
          if error or not report_path:
              print("::error::hardware scan failed: {}".format(error))
              sys.exit(1)
          EOF
          # the runner runs as administrator, so a missing ACPI dump is an error here
          python tests/ci/check_scan.py SysReport/Report.json --acpi-dir SysReport/ACPI
      - name: Headless build (${{ matrix.fixture }})
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          python OpenCoreWizard.py --headless "${{ matrix.answers }}"
          code=$?
          echo "headless exit code: $code (allowed: ${{ matrix.allowed }})"
          case " ${{ matrix.allowed }} " in
            *" $code "*) ;;
            *) echo "::error::headless build exited with $code"; exit 1 ;;
          esac
          if [ "$code" = "3" ]; then
            echo "::warning::${{ matrix.fixture }}: hardware reported as incompatible (exit 3, expected for this fixture)"
          fi
          echo "build_exit=$code" >> "$GITHUB_ENV"
      - name: Check ocvalidate result
        if: env.build_exit == '0'
        shell: bash
        run: |
          # the build job runs on Windows, so the binary is ocvalidate.exe
          ocv=Scripts/ocvalidate.exe
          if [ ! -f "$ocv" ]; then
            echo "::error::$ocv not found"
            exit 1
          fi
          set +e
          "$ocv" Results/EFI/OC/config.plist
          rc=$?
          if [ "$rc" != "0" ]; then
            echo "::error::${{ matrix.fixture }}: ocvalidate exited with $rc"
            exit 1
          fi
      - name: Check DEBUG build
        if: env.build_exit == '0' && matrix.fixture == 'desktop-debug'
        shell: bash
        run: |
          if ! grep -a -q "Ready for takeoff" Results/EFI/OC/OpenCore.efi; then
            echo "::error::OpenCore.efi is not a DEBUG build"
            exit 1
          fi
          python -c "import json, plistlib, sys; d = plistlib.load(open('Results/EFI/OC/config.plist', 'rb'))['Misc']['Debug']; s = json.load(open('Results/build_summary.json')); ok = d['AppleDebug'] and d['ApplePanic'] and d['Target'] == 67 and d['DisplayLevel'] == 2147483714 and s['debug'] is True; print(d); sys.exit(0 if ok else 1)"
      - name: Check post-install kit
        if: env.build_exit == '0' && matrix.fixture == 'desktop'
        shell: bash
        run: |
          kit=Results/PostInstall
          for name in POST-INSTALL.md post-install.command smbios.txt; do
            if [ ! -f "$kit/$name" ]; then
              echo "::error::$kit/$name was not created"
              exit 1
            fi
          done
          # MacPatch is copied from the repository, everything else in Tools would be a download
          if [ -d "$kit/Tools" ] && [ -n "$(ls "$kit/Tools" | grep -v '^MacPatch$')" ]; then
            echo "::error::docs-only kit must not download tools"
            exit 1
          fi
      - name: Upload EFI
        if: env.build_exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: efi-${{ matrix.fixture }}
          path: Results/EFI
          if-no-files-found: error
      - name: Express build
        # after the upload, so the artifact stays the plain headless build
        if: matrix.fixture == 'desktop'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          python OpenCoreWizard.py --headless tests/fixtures/answers-express.json | tee express.txt
          code=${PIPESTATUS[0]}
          echo "express exit code: $code (expected: 0)"
          if [ "$code" != "0" ]; then
            echo "::error::express build exited with $code"
            exit 1
          fi
          if ! grep -q "^Post-install kit: " express.txt; then
            echo "::error::the express summary was not printed"
            exit 1
          fi

  package:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build the Windows app
        run: python -m PyInstaller --noconfirm --clean packaging/opencorewizard.spec
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: OpenCoreWizard-windows
          path: dist/OpenCoreWizard
          if-no-files-found: error
      - name: Smoke test (headless desktop build with the packaged app)
        shell: pwsh
        run: |
          # run a copy so the uploaded folder stays free of downloads and results
          $smoke = Join-Path $env:RUNNER_TEMP "OpenCoreWizard"
          Copy-Item -Recurse dist/OpenCoreWizard $smoke
          $exe = Join-Path $smoke "OpenCoreWizard.exe"
          $log = Join-Path $smoke "OpenCoreWizard.log"
          $p = Start-Process -FilePath $exe -ArgumentList "--headless", "tests/fixtures/answers-desktop.json" -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { Write-Error "packaged headless build exited with $($p.ExitCode)"; exit 1 }
          & (Join-Path $smoke "Scripts\ocvalidate.exe") (Join-Path $smoke "Results\EFI\OC\config.plist")
          if ($LASTEXITCODE -ne 0) { Write-Error "ocvalidate exited with $LASTEXITCODE"; exit 1 }
      - name: Window self-test (packaged app)
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "OpenCoreWizard"
          $log = Join-Path $smoke "OpenCoreWizard.log"
          $p = Start-Process -FilePath (Join-Path $smoke "OpenCoreWizard.exe") -ArgumentList "--self-test" -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { Write-Error "window self-test exited with $($p.ExitCode)"; exit 1 }
      - name: Scan smoke test (headless build from a live scan with the packaged app)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "OpenCoreWizard"
          $log = Join-Path $smoke "OpenCoreWizard.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Join-Path $smoke "OpenCoreWizard.exe") -ArgumentList "--headless", "tests/fixtures/answers-sniff.json" -Wait -PassThru
          $text = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          $text
          Write-Output "packaged scan build exited with $($p.ExitCode) (allowed: 0 3)"
          # 3: the runner hardware is not supported by macOS, which still proves the scan ran
          if ($p.ExitCode -eq 0 -or $p.ExitCode -eq 3) { exit 0 }
          # 1 is accepted only when the report failed validation for devices a Hyper-V VM does not have
          if ($p.ExitCode -eq 1 -and $text -match "failed validation") {
            python tests/ci/check_scan.py (Join-Path $smoke "SysReport/Report.json") --acpi-dir (Join-Path $smoke "SysReport/ACPI")
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          Write-Error "packaged scan build exited with $($p.ExitCode)"; exit 1

  macpatch:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # the system python is what users get from the Command Line Tools, so no setup-python here
      - name: Unit tests with the system python
        working-directory: tests
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -m unittest -v test_macpatch
      - name: Dry run against the Tahoe fixture
        run: |
          sw_vers
          csrutil status || true
          set +e
          /usr/bin/python3 -B postinstall/macpatch --manifest tests/fixtures/patches-tahoe.json --dry-run --log "$RUNNER_TEMP/macpatch.log" > "$RUNNER_TEMP/dry-run.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/dry-run.txt"
          echo "dry run exit code: $code (allowed: 2 3)"
          echo "::notice::macpatch dry run exit $code on macOS $(sw_vers -productVersion), $(/usr/bin/python3 --version 2>&1)"
          if [ "$code" != "2" ] && [ "$code" != "3" ]; then
            echo "::error::macpatch dry run exited with $code"
            exit 1
          fi
          for text in "Patch sets in patches.json:" "(modern_audio)" "(modern_wireless)" "not covered by MacPatch"; do
            if ! grep -qF "$text" "$RUNNER_TEMP/dry-run.txt"; then
              echo "::error::dry run output lacks: $text"
              exit 1
            fi
          done
          if [ "$code" = "2" ] && ! grep -qF "Files (source inside Universal-Binaries.dmg" "$RUNNER_TEMP/dry-run.txt"; then
            echo "::error::dry run failed preflight without listing the files"
            exit 1
          fi
      - name: Dry run log
        if: success() || failure()
        run: cat "$RUNNER_TEMP/macpatch.log" || true
      # the payload check downloads 754 MB on expensive macOS minutes, so it runs only when MacPatch changed
      - name: Did MacPatch change
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          run=false
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "schedule" ]; then
            run=true
          elif [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            run=true
          elif git diff --name-only "$BASE" HEAD | grep -qE '^(postinstall/|tests/ci/check_payload\.py$)'; then
            run=true
          fi
          echo "payload=$run" >> "$GITHUB_OUTPUT"
          echo "payload check: $run"
      - name: Check payload contents
        if: steps.changes.outputs.payload == 'true'
        run: /usr/bin/python3 -B tests/ci/check_payload.py --dest "$RUNNER_TEMP/psp"

  boot:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fixture: [desktop, desktop-debug]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: efi-${{ matrix.fixture }}
          path: efi/EFI
      - name: Install QEMU and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf mtools dosfstools
      - name: Boot EFI in QEMU
        run: bash tests/boot/run_qemu.sh efi/EFI
      - name: Analyze serial log
        if: success() || failure()
        shell: bash
        run: |
          python OpenCoreWizard.py --analyze-log serial.log | tee analysis.txt
          if ! grep -q "^Verdict: *Reached the boot picker" analysis.txt; then
            echo "::error::${{ matrix.fixture }}: the boot log analysis did not report the boot picker"
            exit 1
          fi

  recovery-download:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Board id
        id: board
        shell: bash
        run: |
          echo "board=$(python tests/ci/download_recovery.py --macos 26 --print-board)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/recovery
          key: recovery-${{ steps.board.outputs.board }}-${{ steps.board.outputs.week }}
      - name: Download and verify recovery image
        shell: bash
        run: python tests/ci/download_recovery.py --macos 26 --dest "${{ runner.temp }}/recovery"
